[package]
name = "miranda-nodes"
version.workspace = true
edition.workspace = true

[dependencies]
# Avatar-animation deps (glam, wide, noise, rand) are kept because
# the avatar modules will be re-enabled next week when 3D work resumes.
# For now those mod declarations are stripped from lib.rs so they don't
# block the build — the deps themselves compile fine.
glam = "0.29"
wide = "0.7"
rand = { version = "0.8", default-features = false, features = ["small_rng", "std", "std_rng"] }
noise = "0.9"
neo4rs = "0.8.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
thiserror = "2.0.20"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

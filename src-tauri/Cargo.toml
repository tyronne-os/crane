[package]
name = "crane"
version.workspace = true
edition.workspace = true

[dependencies]
# Tauri v2 — no shell-open-api (moved to tauri-plugin-shell in v2, not needed yet)
tauri = { version = "2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dirs-next = "2.0"

[build-dependencies]
tauri-build = "2.0"

